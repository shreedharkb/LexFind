# ============================================================
# LexFind – Docker Compose Stack
# Author: Shreedhar K B
#
# Commands:
#   docker compose up -d                    → start everything
#   docker compose down                     → stop all
#   docker compose logs -f api              → tail API logs
#   docker compose pull && docker compose up -d --build  → redeploy
# ============================================================


networks:
  lexfind_net:
    driver: bridge

volumes:
  lexfind_pg_data:
  lexfind_rabbitmq_data:
  lexfind_tmp_uploads:
  lexfind_qdrant_data:

services:

  # ── Qdrant Vector DB ────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: lexfind_qdrant
    restart: always
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - lexfind_qdrant_data:/qdrant/storage
    networks:
      - lexfind_net

  # ── PostgreSQL + pgvector ────────────────────────────────
  db:
    image: pgvector/pgvector:pg17
    container_name: lexfind_db
    restart: always
    ports:
      - "127.0.0.1:5433:5432" # host 5433 to avoid clashing with local Postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lexfind
    volumes:
      - lexfind_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lexfind_net

  # ── RabbitMQ Broker ──────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: lexfind_rabbitmq
    restart: always
    ports:
      - "127.0.0.1:5672:5672" # AMQP
      - "127.0.0.1:15672:15672" # Management UI → http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - lexfind_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - lexfind_net

  # ── Redis (for rate limiting) ────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lexfind_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - lexfind_net

  # ── Database migrations ──────────────────────────────────────────────────
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lexfind_migrate
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/lexfind
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lexfind_net

  # ── FastAPI Backend ──────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lexfind_api
    restart: always
    ports:
      - "127.0.0.1:8000:8000"    # bind to localhost only; nginx proxies externally
    env_file:
      - ./backend/.env
    environment:
      # Inside Compose the Qdrant container is reachable by its service name.
      # Local uvicorn uses backend/.env's localhost value instead.
      QDRANT_HOST: qdrant
      QDRANT_URL: ""
      DATABASE_URL: postgresql://postgres:postgres@db:5432/lexfind
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: db+postgresql://postgres:postgres@db:5432/lexfind
      REDIS_URL: redis://redis:6379/0
      USE_LOCAL_FILES: "true"
    volumes:
      - ./backend/data:/app/data
      - ./backend/scripts:/app/scripts
      - lexfind_tmp_uploads:/tmp/confidential_uploads
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - lexfind_net

  # ── Celery Worker ────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lexfind_celery
    restart: always
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=info
      --concurrency=2
      --prefetch-multiplier=1
      -P prefork
      -Q lexfind_documents
    env_file:
      - ./backend/.env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_URL: ""
      DATABASE_URL: postgresql://postgres:postgres@db:5432/lexfind
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: db+postgresql://postgres:postgres@db:5432/lexfind
      USE_LOCAL_FILES: "true"
    volumes:
      - ./backend/data:/app/data
      - lexfind_tmp_uploads:/tmp/confidential_uploads
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "celery", "-A", "app.workers.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s
    networks:
      - lexfind_net

