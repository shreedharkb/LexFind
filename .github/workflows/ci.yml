name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        # Use the CPU wheel in CI; CUDA libraries are unnecessary and can
        # exhaust the runner's disk before tests even start.
        pip install torch==2.6.0+cpu --index-url https://download.pytorch.org/whl/cpu
        grep -v '^torch' requirements.txt > /tmp/requirements-no-torch.txt
        pip install -r /tmp/requirements-no-torch.txt

    - name: Run Tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lexfind
        JWT_SECRET_KEY: test-jwt-secret-key-at-least-32-characters-long
        USE_LOCAL_FILES: "true"
      run: |
        cd backend
        pytest tests/
